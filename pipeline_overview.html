<html style="margin:0;padding:0;">
<title>点云拼接与目标检测流水线总览</title>
<div style="width:100%;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#fafbfc;padding:16px 12px;">

  .t-title{font:700 20px system-ui;fill:#101828}

<svg viewBox="0 0 1180 790" width="100%" style="display:block;" role="img" aria-label="点云拼接与目标检测流水线总览示意图（示意）">

  <text class="t-sub" x="30" y="54">数据：SUN RGB-D / SUN3D 序列 ｜ 技术栈：Python 3.8 + PyTorch 1.13.1 + CUDA 11.7 + Open3D 0.17.0 + VoteNet + YOLOv8n ｜ 环境：单卡 V100</text>

  <!-- ================= 阶段卡片 ================= -->
  <!-- ① 数据预处理 -->
  <g>
    <rect class="card" x="30" y="70" width="252" height="530" rx="12"/>
    <rect class="h-c1" x="30" y="70" width="252" height="36" rx="12"/>
    <rect class="h-c1" x="30" y="88" width="252" height="18"/>
    <text class="h-t" x="48" y="88">① 数据预处理 preprocess/</text>
    <text class="h-s" x="48" y="101">第二批 ｜ 解析 + 反投影 + 数据生成</text>

    <rect class="b-c1" x="40" y="122" width="232" height="62" rx="8"/>
    <text class="step-t" x="52" y="146">parse_sunrgbd.py</text>
    <text class="step-d" x="52" y="167">解析 RGB·深度·内参·外参</text>

    <rect class="b-c1" x="40" y="198" width="232" height="62" rx="8"/>
    <text class="step-t" x="52" y="222">depth_to_pointcloud.py</text>
    <text class="step-d" x="52" y="243">深度图反投影为三维点云</text>

    <rect class="b-c1" x="40" y="274" width="232" height="62" rx="8"/>
    <text class="step-t" x="52" y="298">sample_frame_pairs.py</text>
    <text class="step-d" x="52" y="319">SUN3D 帧对采样（间隔 5/10/30）</text>

    <rect class="b-c1" x="40" y="350" width="232" height="62" rx="8"/>
    <text class="step-t" x="52" y="374">compute_pose_gt.py</text>
    <text class="step-d" x="52" y="395">相对位姿 T_AB 真值（6DOF）</text>

    <rect class="b-c1" x="40" y="426" width="232" height="62" rx="8"/>
    <text class="step-t" x="52" y="450">generate_detection_data.py</text>
    <text class="step-d" x="52" y="471">VoteNet 数据（5 万点/帧）</text>

    <line class="arrow" x1="156" y1="184" x2="156" y2="196" marker-end="url(#arr)"/>
    <line class="arrow" x1="156" y1="260" x2="156" y2="272" marker-end="url(#arr)"/>
    <line class="arrow" x1="156" y1="336" x2="156" y2="348" marker-end="url(#arr)"/>
    <line class="arrow" x1="156" y1="412" x2="156" y2="424" marker-end="url(#arr)"/>
  </g>

  <g>
    <rect class="card" x="318" y="70" width="252" height="530" rx="12"/>
    <rect class="h-c2" x="318" y="70" width="252" height="36" rx="12"/>
    <rect class="h-c2" x="318" y="88" width="252" height="18"/>
    <text class="h-t" x="336" y="88">② 点云拼接 registration/</text>
    <text class="h-s" x="336" y="101">第三批 ｜ 纯 CPU</text>

    <rect class="b-c2" x="328" y="122" width="232" height="62" rx="8"/>
    <text class="step-t" x="340" y="146">preprocess_pointcloud.py</text>
    <text class="step-d" x="340" y="167">去噪·体素降采样·法向量</text>

    <rect class="b-c2" x="328" y="198" width="232" height="62" rx="8"/>
    <text class="step-t" x="340" y="222">coarse_registration.py</text>
    <text class="step-d" x="340" y="243">FPFH + RANSAC 粗配准</text>

    <rect class="b-c2" x="328" y="274" width="232" height="62" rx="8"/>
    <text class="step-t" x="340" y="298">fine_registration.py</text>
    <text class="step-d" x="340" y="319">改进 ICP（点到平面+早停）</text>

    <rect class="b-c2" x="328" y="350" width="232" height="62" rx="8"/>
    <text class="step-t" x="340" y="374">evaluate_registration.py</text>
    <text class="step-d" x="340" y="395">RMSE·旋转/平移误差·成功率</text>

    <rect class="b-c2" x="328" y="426" width="232" height="62" rx="8"/>
    <text class="step-t" x="340" y="450">visualize_registration.py</text>
    <text class="step-d" x="340" y="471">拼接前后对比视图</text>

    <line class="arrow" x1="444" y1="184" x2="444" y2="196" marker-end="url(#arr)"/>
    <line class="arrow" x1="444" y1="260" x2="444" y2="272" marker-end="url(#arr)"/>
    <line class="arrow" x1="444" y1="336" x2="444" y2="348" marker-end="url(#arr)"/>
    <line class="arrow" x1="444" y1="412" x2="444" y2="424" marker-end="url(#arr)"/>
  </g>

  <!-- ③ 三维目标检测 -->
  <g>
    <rect class="card" x="606" y="70" width="252" height="530" rx="12"/>
    <rect class="h-c3" x="606" y="70" width="252" height="36" rx="12"/>
    <rect class="h-c3" x="606" y="88" width="252" height="18"/>
    <text class="h-t" x="624" y="88">③ 三维目标检测 detection/</text>
    <text class="h-s" x="624" y="101">第四批 ｜ 双分支特征融合</text>

    <rect class="b-c3" x="616" y="122" width="232" height="62" rx="8"/>
    <text class="step-t" x="628" y="146">votenet_baseline.py</text>
    <text class="step-d" x="628" y="167">点云分支（VoteNet）</text>

    <rect class="b-c3" x="616" y="198" width="232" height="62" rx="8"/>
    <text class="step-t" x="628" y="222">yolov8_feature.py</text>
    <text class="step-d" x="628" y="243">RGB 分支（YOLOv8n P3 层）</text>

    <rect class="b-c3" x="616" y="274" width="232" height="62" rx="8"/>
    <text class="step-t" x="628" y="298">projection.py</text>
    <text class="step-d" x="628" y="319">3D→2D 投影 + 双线性采样</text>

    <rect class="b-c3" x="616" y="350" width="232" height="62" rx="8"/>
    <text class="step-t" x="628" y="374">fusion_head.py</text>

    <rect class="b-c3" x="616" y="426" width="232" height="62" rx="8"/>
    <text class="step-t" x="628" y="450">lightweight_head.py</text>
    <text class="step-d" x="628" y="471">DSConv1d 轻量化（可选）</text>

    <rect class="b-c3" x="616" y="502" width="232" height="62" rx="8"/>
    <text class="step-t" x="628" y="526">train_fusion.py</text>
    <text class="step-d" x="628" y="547">evaluate_detection.py · 60/20 epoch</text>

    <line class="arrow" x1="732" y1="184" x2="732" y2="196" marker-end="url(#arr)"/>
    <line class="arrow" x1="732" y1="260" x2="732" y2="272" marker-end="url(#arr)"/>
    <line class="arrow" x1="732" y1="336" x2="732" y2="348" marker-end="url(#arr)"/>
    <line class="arrow" x1="732" y1="412" x2="732" y2="424" marker-end="url(#arr)"/>
    <line class="arrow" x1="732" y1="488" x2="732" y2="500" marker-end="url(#arr)"/>
  </g>

  <!-- ④ 可视化集成 -->
  <g>
    <rect class="card" x="894" y="70" width="252" height="530" rx="12"/>
    <rect class="h-c4" x="894" y="70" width="252" height="36" rx="12"/>
    <rect class="h-c4" x="894" y="88" width="252" height="18"/>
    <text class="h-t" x="912" y="88">④ 可视化集成 app/</text>
    <text class="h-s" x="912" y="101">第六批 ｜ Open3D 展示</text>

    <rect class="b-c4" x="904" y="122" width="232" height="62" rx="8"/>

    <text class="step-d" x="916" y="167">加载场景多帧数据</text>

    <rect class="b-c4" x="904" y="198" width="232" height="62" rx="8"/>
    <text class="step-t" x="916" y="222">compare_registration.py</text>
    <text class="step-d" x="916" y="243">拼接前后左右视图对比</text>

    <rect class="b-c4" x="904" y="274" width="232" height="62" rx="8"/>
    <text class="step-t" x="916" y="298">overlay_detection.py</text>
    <text class="step-d" x="916" y="319">3D 框 + 类别标注叠加</text>

    <rect class="b-c4" x="904" y="350" width="232" height="62" rx="8"/>
    <text class="step-t" x="916" y="374">export_demo.py</text>
    <text class="step-d" x="916" y="395">导出 GIF / 视频</text>

    <line class="arrow" x1="1020" y1="184" x2="1020" y2="196" marker-end="url(#arr)"/>
    <line class="arrow" x1="1020" y1="260" x2="1020" y2="272" marker-end="url(#arr)"/>
    <line class="arrow" x1="1020" y1="336" x2="1020" y2="348" marker-end="url(#arr)"/>
  </g>

  <!-- 卡片间数据流箭头 -->
  <line class="arrow" x1="286" y1="330" x2="312" y2="330" marker-end="url(#arr)"/>
  <text class="arr-label" x="270" y="348">点云·帧对·真值</text>
  <line class="arrow" x1="574" y1="330" x2="600" y2="330" marker-end="url(#arr)"/>

  <line class="arrow" x1="862" y1="330" x2="888" y2="330" marker-end="url(#arr)"/>

  <rect class="b-c3" x="586" y="654" width="256" height="64" rx="8"/>
  <text class="lane-h" x="600" y="678">results/</text>
  <text class="lane-d" x="600" y="698">预处理产物 · 配准/检测指标 · 日志</text>

  <rect class="b-c4" x="856" y="654" width="256" height="64" rx="8"/>
  <text class="lane-h" x="870" y="678">docs/</text>
  <text class="lane-d" x="870" y="698">setup / troubleshooting / experiment_log（第七批）</text>

  <text class="note" x="30" y="768">示意：卡片=模块目录，步骤=脚本文件，批号=输出批次；具体参数见 configs/default.yaml（第一批交付）。</text>
