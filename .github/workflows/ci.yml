# ============================================================
# .github/workflows/ci.yml —— GitHub Actions 持续集成
# ------------------------------------------------------------
# 触发：push / pull_request
# 作业：
#   1. syntax-check：Python 语法检查（compileall，不安装重依赖）
#   2. env-check：跑 scripts/check_env.sh --ci，核对核心依赖版本
#   3. smoke：跑 scripts/run_smoke.sh 的 CI 模式
#      （只检查版本/Open3D/合成深度图/合成立方体配准，
#        不依赖 GPU、PyTorch、SUN RGB-D 数据集）
# 说明：CI 不跑任何需要 GPU 或大数据集的任务（V100 上按
#       docs/v100_checklist.md 执行）。
# ============================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  syntax-check:
    name: Python 语法检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: compileall 语法检查
        run: |
          python -m compileall -q preprocess registration detection app scripts \
              && echo "语法检查通过"

  env-check:
    name: 环境依赖检查（check_env.sh）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 安装 Open3D 系统依赖（headless）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: 安装核心依赖（CPU 栈，不含 PyTorch/ultralytics）
        run: |
          python -m pip install --upgrade pip
          pip install \
              "numpy==1.24.4" \
              "scipy>=1.9,<1.11" \
              "open3d==0.17.0" \
              "plyfile>=0.7.4" \
              "PyYAML>=6.0" \
              "Pillow>=10.0" \
              "imageio>=2.31" \
              "tqdm>=4.66" \
              "matplotlib>=3.6,<3.8" \
              "opencv-python-headless>=4.8.0"

      - name: 运行环境检查（CI 模式）
        run: |
          chmod +x scripts/check_env.sh
          bash scripts/check_env.sh --ci

  smoke:
    name: 冒烟测试（无 GPU / 无数据集）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 安装 Open3D 系统依赖（headless）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: 安装冒烟测试依赖（仅 CPU 栈，不含 PyTorch）
        run: |
          python -m pip install --upgrade pip
          pip install \
              "numpy==1.24.4" \
              "scipy>=1.9,<1.11" \
              "open3d==0.17.0" \
              "pillow>=10.0" \
              "PyYAML>=6.0"

      - name: 运行冒烟测试（CI 模式）
        run: |
          chmod +x scripts/run_smoke.sh
          SMOKE_CI=1 bash scripts/run_smoke.sh
